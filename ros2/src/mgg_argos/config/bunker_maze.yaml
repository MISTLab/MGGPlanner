# MGG planner tuned for 4 AgileX Bunker Mini tracked robots in a maze environment.

/**/mggplanner_node:
  ros__parameters:
    map:
      resolution: 0.1
      max_range: 20.0

    RobotParams:
      type: kGroundRobot
      size: [0.66, 0.584, 0.281]
      size_extension_min: [0.0, 0.0, 0.0]
      size_extension: [0.08, 0.08, 0.05]
      center_offset: [0.0, 0.0, 0.0]
      relax_ratio: 0.5
      bound_mode: kExtendedBound
      safety_extension: [0.6, 0.8, 0.05]

    SensorParams:
      sensor_list: ["VLP16"]
      VLP16:
        type: kLidar
        max_range: 20.0
        # Bunker Mini body height 0.281m + lidar standoff 0.05m = 0.331m
        center_offset: [0.0, 0.0, 0.33]
        rotations: [0.0, 0.0, 0.0]
        # 360 x 45 degrees vertical FOV (-30 to +15)
        fov: [6.283185307179586, 0.7853981633974483]
        resolution: [0.08726646259971647, 0.08726646259971647]
        frontier_percentage_threshold: 0.05

    BoundedSpaceParams:
      Global:
        type: kCuboid
        min_val: [-5.8, -5.8, -0.1]
        max_val: [5.8, 5.8, 1.1]

      Local:
        type: kCuboid
        min_val: [-6.0, -6.0, -0.5]
        max_val: [6.0, 6.0, 0.5]
        min_extension: [0.0, 0.0, 0.0]
        max_extension: [0.0, 0.0, 0.0]
      LocalSearch:
        type: kCuboid
        min_val: [-14.0, -14.0, -2.0]
        max_val: [14.0, 14.0, 2.0]
      LocalAdaptiveExp:
        type: kCuboid
        min_val: [-4.0, -4.0, -0.3]
        max_val: [4.0, 4.0, 0.3]
      GridGraphLocal:
        type: kCuboid
        min_val: [-5.0, -5.0, -0.2]
        max_val: [5.0, 5.0, 0.3]
        resolution: [0.25, 0.25, 0.1]

    RandomSamplerParams:
      SamplerForExploration:
        X:
          pdf_type: kUniform
          sample_mode: kLocal
        Y:
          pdf_type: kUniform
          sample_mode: kLocal
        Z:
          pdf_type: kUniform
          sample_mode: kLocal
        Heading:
          pdf_type: kUniform
          sample_mode: kManual
          min_val: -3.141592653589793
          max_val: 3.141592653589793
      SamplerForSearching:
        X:
          pdf_type: kUniform
          sample_mode: kLocal
        Y:
          pdf_type: kUniform
          sample_mode: kLocal
        Z:
          pdf_type: kUniform
          sample_mode: kLocal
        Heading:
          pdf_type: kUniform
          sample_mode: kManual
          min_val: -3.141592653589793
          max_val: 3.141592653589793
      SamplerForAdaptiveExp:
        X:
          pdf_type: kUniform
          sample_mode: kLocal
        Y:
          pdf_type: kUniform
          sample_mode: kLocal
        Z:
          pdf_type: kUniform
          sample_mode: kLocal
        Heading:
          pdf_type: kUniform
          sample_mode: kManual
          min_val: -3.141592653589793
          max_val: 3.141592653589793

    PlanningParams:
      robot_id: 1
      type: kAdaptiveExploration
      rr_mode: kGraph
      bound_mode: kExtremeBound
      exp_sensor_list: ["VLP16"]
      edge_length_min: 0.10
      edge_length_max: 1.0
      edge_overshoot: 0.0
      num_vertices_max: 8000
      num_edges_max: 50000
      num_loops_cutoff: 2000
      num_loops_max: 200000
      nearest_range: 0.5
      nearest_range_z: 0.20
      nearest_range_min: 0.10
      nearest_range_max: 0.9
      use_current_state: true
      augment_free_voxels_time: 1
      free_frustum_before_planning: false
      use_ray_model_for_volumetric_gain: true
      path_length_penalty: 0.07
      path_direction_penalty: 0.3
      hanging_vertex_penalty: 5.0
      exp_gain_voxel_size: 0.25
      occupied_voxel_gain: 0.0
      free_voxel_gain: 0.0
      unknown_voxel_gain: 60.0
      nonuniform_ray_cast: true
      ray_cast_step_size_multiplier: 1.0
      freespace_cloud_enable: false
      leafs_only_for_volumetric_gain: false
      cluster_vertices_for_gain: true
      clustering_radius: 0.3
      build_grid_local_graph: true
      max_ground_height: 0.35
      robot_height: 0.281
      max_inclination: 1.6580627893946132
      yaw_tangent_correction: true
      traverse_length_max: 4.0
      traverse_time_max: 40.0
      path_safety_enhance_enable: true
      path_interpolation_distance: 0.25
      auto_global_planner_enable: true
      relaxed_corridor_multiplier: 1.5
      homing_backward: false
      auto_homing_enable: true
      time_budget_limit: 3600
      global_frame_id: map
      global_path_inclination_check: true
      go_home_if_fully_explored: true
      geofence_checking_enable: false

    AdaptiveObbParams:
      type: kPca
      local_pointcloud_range: 20.0
      bounding_box_size_max: 20

    neighbour_offsets: [1.0, 0.0, 0.0, 0.0,
                        2.0, 0.0, 0.0, 0.0,
                        3.0, 0.0, 0.0, 0.0,
                        4.0, 0.0, 0.0, 0.0]
    global_vertex_spacing: 0.6
    graph_publish_period_sec: 2.0

/**/mgg_pci:
  ros__parameters:
    world_frame: map
    service_timeout_sec: 60.0
    auto_period_sec: 8.0
    bound_mode: 0

mgg_argos_bridge:
  ros__parameters:
    socket_path: /tmp/mgg_argos.sock
    world_frame: map
    robots: ["r0", "r1", "r2", "r3"]
    lidar_translation: [0.0, 0.0, 0.33]
    publish_ground_truth: true
    send_overlays: true
    max_overlay_edges: 20000
    real_time_factor: 1.0
